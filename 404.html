<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Not found — Frontier Index</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark light;--bg:#0a0a0c;--fg:#f3f0e9;--a:#ff6b35}
@media(prefers-color-scheme:light){:root{--bg:#f5f2eb;--fg:#16151a;--a:#e8551f}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:Georgia,serif;text-align:center;padding:24px}
h1{font-size:clamp(72px,18vw,200px);font-weight:400;margin:0;line-height:1;font-style:italic;color:var(--a)}
p{font-family:system-ui,sans-serif;opacity:.7}
a{color:inherit}
</style>
</head>
<body>
<main><h1>404</h1><p>That page isn't in the index. <a id="home" href="./">Back to Frontier Index</a></p></main>
<script>
// On project pages (user.github.io/repo/...) the home link must include the repo segment.
const seg=location.pathname.split("/")[1];
if(location.hostname.endsWith("github.io")&&seg&&!seg.includes("."))document.getElementById("home").href="/"+seg+"/";
</script>
</body>
</html>
